<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1: iOS Safari zoomed into a text field (under 16px) and never zoomed back (owner, 2026-11-18); people can still pinch-zoom on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>BlokDust 2 | Build instruments and self-playing music</title>
    <link rel="icon" type="image/png" href="favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased; /* v1 styles.css: also governs canvas text on macOS */
        height: 100%;
        overflow: hidden;
        background: #1a1f21;
        font:
          13px system-ui,
          sans-serif;
      }
      #stage,
      #stage canvas {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
      /* Touch screens (owner, 2026-11-08; Funputs #45): no selection, no callout/magnifier, no tap flash. Text fields
         keep theirs. `-webkit-user-select`: Safari before 17 ignores the unprefixed one. */
      html,
      body,
      #stage,
      #stage canvas {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
      }
      /* v1 Splash's black until the scene has drawn the start button (Splash) under it; then clear (main.ts). Embeds
         give it their own play overlay. */
      #start {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        color: #fff4d6;
        cursor: pointer;
        background: rgb(10 10 10);
      }
      /* Without JavaScript (and for crawlers reading the HTML): what BlokDust is, and links into the guide. */
      #about {
        position: fixed;
        inset: 0;
        z-index: 4;
        padding: 24px 16px;
        overflow: auto;
        color: #fff4d6;
        background: rgb(10 10 10);
      }
      #about a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="start" role="button" aria-label="Start"></div>
    <noscript>
      <div id="about">
        <h1>BlokDust 2</h1>
        <p>
          Build instruments, create sounds and make self-playing musical worlds by connecting
          blocks. Available on the web, standalone and as VST3, AU and AUv3 plugins.
        </p>
        <p>BlokDust needs JavaScript to play.</p>
        <ul>
          <li><a href="/guide/">BlokDust Guide</a></li>
          <li><a href="/guide/get-started/">Get Started</a></li>
          <li><a href="/blocks/">Blocks</a></li>
          <li><a href="/downloads/">Downloads</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
